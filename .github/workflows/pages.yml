name: Publish game
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: macos-15
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/configure-pages@v6.0.0
      - name: Prepare tested static files
        run: |
          mkdir -p _site
          cp index.html style.css game.js .nojekyll _site/
          cp -R assets _site/assets
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: _site
      - name: Publish GitHub Pages
        id: publish
        uses: actions/deploy-pages@v5.0.1
