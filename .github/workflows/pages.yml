name: Publish game
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/configure-pages@v6.0.0
      - name: Prepare tested static files
        run: |
          mkdir -p _site
          cp index.html style.css game.js .nojekyll _site/
          cp -R assets _site/assets
          cp -R audio _site/audio
          mkdir -p _site/docs/handoff
          cp docs/v20-reference-board.html docs/v20-ui-references.md docs/v21-feel-and-gallery.md docs/v22-entry-and-hold.md docs/v23-shared-local-pours.md docs/v24-collection-and-performance.md docs/v24-collection-lab.html docs/v25-adhesion-and-desk.md docs/v28-gallery-and-gestures.md docs/v29-active-coat-fade.md docs/v30-startup-and-finish.md _site/docs/
          cp docs/handoff/v20-cpu-benchmark.json _site/docs/handoff/
          cp docs/handoff/v21-*.png docs/handoff/v22-*.png docs/handoff/v23-*.png docs/handoff/v24-*.png docs/handoff/v24-collection-benchmark.json docs/handoff/v25-*.png docs/handoff/v25-*.json docs/handoff/v28-*.png docs/handoff/v29-*.png docs/handoff/v30-*.png _site/docs/handoff/
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: _site
      - name: Publish GitHub Pages
        id: publish
        uses: actions/deploy-pages@v5.0.1
